# Disposable MySQL for integration tests only. Data is not persisted.
services:
  mysql-test:
    image: mysql:8.4
    container_name: aera-mineral-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: aera_mineral_test
      MYSQL_USER: aera_test
      MYSQL_PASSWORD: aera_test_password
    ports:
      - '127.0.0.1:33306:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uaera_test -paera_test_password --silent']
      interval: 3s
      timeout: 3s
      retries: 40
